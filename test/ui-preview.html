<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>autoverify UI 本地预览</title>
<style>
:root{color-scheme:light;font:15px/1.6 system-ui,sans-serif;color:#263340;background:#f1f4f8}
body{margin:0}body.dark{color-scheme:dark;color:#e2e8f0;background:#161c24}
main{max-width:1050px;margin:24px auto;padding:0 20px}.preview{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px;color:#657687}
.cbi-section,.cbi-map{background:#fff;border:1px solid #dbe2eb;border-radius:10px;padding:0 0 16px;margin-bottom:20px;box-shadow:0 3px 14px #1b355808}
.dark .cbi-section,.dark .cbi-map{background:#212b37;border-color:#3c4857}.cbi-map>h2,.cbi-map>.cbi-map-descr{margin:14px 20px}.cbi-map-descr,.cbi-section-descr{opacity:.75;font-size:.9em}
h2{font-size:1.25em}h3{font-size:1.05em}.tabs{display:flex;gap:5px;border-bottom:1px solid #8a98aa50;padding:0 16px;flex-wrap:wrap}.tabs button{border:0;border-radius:0;white-space:nowrap;padding:12px 14px;background:transparent}.tabs button.active{border-bottom:3px solid #4488aa;color:#4488aa;font-weight:600}
.tab{padding:18px 20px}.tab>p{opacity:.75;font-size:.9em;margin-top:0}.group{margin:0 0 24px}.group h3{margin:0 0 14px}.cbi-value{display:grid;grid-template-columns:165px minmax(0,1fr);gap:16px;padding:12px 0;border-bottom:1px solid #8a98aa20}.cbi-value-title{font-weight:500;padding-top:5px}.cbi-value-description{font-size:.85em;opacity:.7;margin:6px 0 0;line-height:1.7}
input,select,button{font:inherit;color:inherit}input:not([type=checkbox]),select{width:100%;max-width:550px;box-sizing:border-box;padding:8px 10px;border:1px solid #8a98aa70;border-radius:6px;background:transparent}input[type=checkbox]{width:20px;height:20px;accent-color:#4488aa}.btn{padding:7px 14px;border:1px solid #8a98aa70;background:transparent;border-radius:6px;cursor:pointer}.cbi-button-action{background:#397e9b;color:white;border-color:#397e9b}.cbi-button:disabled{opacity:.55}.av-body>.cbi-section-descr{margin:10px 0}
.modal-backdrop{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:20px}.modal{background:#fff;border-radius:12px;padding:22px;max-width:740px;width:90%;max-height:85vh;overflow:auto}.dark .modal{background:#212b37}.right{text-align:right}.hidden,[hidden]{display:none!important}.savebar{text-align:right;padding:12px 20px}.savebar button{background:#397e9b;color:white}.av-page{min-width:0}
@media(max-width:600px){main{padding:0 12px;margin:12px auto}.cbi-value{grid-template-columns:1fr;gap:6px}.tab{padding:14px}.tabs{padding:0 5px}.tabs button{padding:10px}.preview{font-size:12px}}
</style>
<main><div class="preview"><span>autoverify · 本地预览 / 模拟数据</span><button class="btn" id="theme">切换亮 / 暗色</button></div><div id="app">正在加载…</div></main>
<script>
// Only the LuCI adapters are mocked; the view and its styles are loaded from source.
String.prototype.format=function(){let i=0,a=arguments;return this.replace(/%[sd]/g,()=>String(a[i++]));};
window._=s=>s;
function append(n,c){if(c==null)return;if(Array.isArray(c))c.forEach(x=>append(n,x));else n.appendChild(c instanceof Node?c:document.createTextNode(String(c)));}
window.E=function(tag,attrs,children){if(Array.isArray(tag)){let f=document.createDocumentFragment();append(f,tag);return f;}if(typeof attrs==='string'||Array.isArray(attrs)||attrs instanceof Node){children=attrs;attrs={};}let n=document.createElement(tag);for(let [k,v] of Object.entries(attrs||{})){if(v==null)continue;if(typeof v==='function')n.addEventListener(k,v);else n.setAttribute(k,String(v));}append(n,children);return n;};
const dom={content(n,c){n.replaceChildren();append(n,c);}};
const data={main:{enabled:'1',username:'示例账号',password:''},dns:{enabled:'1',doh_provider:'tencent',doh_url:'',doh_bootstrap:'119.29.29.29'}};
const uci={load:()=>Promise.resolve(),get:(pkg,section,key)=>data[section]?.[key]};
const types={};for(let key of ['Flag','Value','DynamicList','ListValue','DummyValue','SectionValue','NamedSection'])types[key]=key;
class Option{constructor(section,type,name,args){this.section=section;this.type=type;this.name=name;this.args=args;this.rules=[];this.choices=[];if(type==='SectionValue')this.subsection=new Section(section.map,args[1],args[3]);}depends(...a){this.rules.push(a);}value(k,v){this.choices.push([k,v]);}}
class Section{constructor(map,id,title){this.map=map;this.id=id;this.title=title;this.options=[];this.tabs=[];}tab(id,title,description){this.tabs.push({id,title,description});}option(type,name,...args){let o=new Option(this,type,name,args);this.options.push(o);return o;}taboption(tab,type,name,...args){let o=this.option(type,name,...args);o.tab=tab;return o;}formvalue(id,key){return this.map.values[id+'.'+key];}}
class MapForm{constructor(config,title,description){this.config=config;this.title=title;this.description=description;this.sections=[];this.values={};this.rows=[];window.previewMap=this;}section(type,id,kind){let s=new Section(this,id);this.sections.push(s);return s;}checkDepends(){for(let [row,o] of this.rows)row.hidden=o.rules.length>0&&!o.rules.some(rule=>{let constraints=typeof rule[0]==='object'?rule[0]:{[rule[0]]:rule[1]};return Object.entries(constraints).every(([k,v])=>String(o.section.formvalue(o.section.id,k))===v);});}renderOption(o){if(o.type==='SectionValue'){let g=E('div',{'class':'group'},E('h3',{},o.subsection.title));o.subsection.options.forEach(x=>g.appendChild(this.renderOption(x)));return g;}let id=o.section.id+'.'+o.name,value=data[o.section.id]?.[o.name]??o.default??'';this.values[id]=value;let field;if(o.type==='DummyValue')field=o.renderWidget();else{field=E(o.type==='ListValue'?'select':'input',{'id':'preview-'+id,'aria-label':o.args[0]||o.name});if(o.type==='ListValue')o.choices.forEach(([k,v])=>field.appendChild(E('option',{value:k},v)));else field.type=o.type==='Flag'?'checkbox':o.password?'password':'text';if(o.type==='Flag')field.checked=value==='1';else field.value=value;field.placeholder=o.placeholder||'';field.addEventListener('input',ev=>{this.values[id]=o.type==='Flag'?(field.checked?'1':'0'):field.value;this.checkDepends();if(o.onchange)o.onchange.call(o,ev,o.section.id,this.values[id]);});}let body=E('div',{},[field,o.args[1]?E('div',{'class':'cbi-value-description'},o.args[1]):null]);let row=E('div',{'class':'cbi-value'},[E('label',{'class':'cbi-value-title','for':'preview-'+id},o.args[0]||o.name),body]);this.rows.push([row,o]);return row;}render(){let map=E('div',{'class':'cbi-map'},[E('h2',{},this.title),E('div',{'class':'cbi-map-descr'},this.description)]);for(let s of this.sections){let nav=E('div',{'class':'tabs','role':'tablist'});let panels=[];for(let tab of s.tabs){let panel=E('div',{'class':'tab','role':'tabpanel'},E('p',{},tab.description));s.options.filter(o=>o.tab===tab.id).forEach(o=>panel.appendChild(this.renderOption(o)));let button=E('button',{'type':'button','role':'tab'},tab.title);button.onclick=()=>{panels.forEach(([b,p])=>{b.classList.toggle('active',b===button);b.setAttribute('aria-selected',b===button);p.hidden=p!==panel;});};nav.appendChild(button);panels.push([button,panel]);}map.appendChild(nav);panels.forEach(([,p])=>map.appendChild(p));panels.find(([b])=>b.textContent==='DNS 与 DoH')[0].click();}map.appendChild(E('div',{'class':'savebar'},E('button',{'class':'btn','click':()=>alert('本地预览不保存配置')},'保存并应用')));this.checkDepends();return Promise.resolve(map);}}
const form={...types,Map:MapForm};
const snapshot={service_enabled:1,result:'success',state:'online',wan_interface:'wan',wan_ipv4:'192.0.2.10',lock_state:'free',source:'daemon',operation:'once',duration_ms:1240,finished_at:Math.floor(Date.now()/1000),portal_origin:'http://192.0.2.1:9090',http_code:200,probe:'not_run',ipv6_global:'none',ipv6_default_route:'none'};
const fs={exec:(cmd,args)=>new Promise(resolve=>setTimeout(()=>resolve({code:0,stdout:args.includes('--json')?JSON.stringify(snapshot):'示例输出：命令执行完成',stderr:''}),args.includes('--json')?60:1000))};
const rpc={declare:()=>()=>Promise.resolve({autoverify:{instances:{main:{running:true,pid:723}}}})};
const L={resolveDefault:(p,v)=>p.catch(()=>v)};
const poll={add:fn=>setInterval(fn,10000)};
const ui={createHandlerFn:(self,method,...args)=>()=>self[method](...args),addNotification:(x,node)=>alert(node.textContent),hideModal:()=>document.querySelector('.modal-backdrop')?.remove(),showModal:(title,body)=>{let backdrop=E('div',{'class':'modal-backdrop'},E('div',{'class':'modal','role':'dialog','aria-label':title},[E('h2',{},title),...body]));document.body.appendChild(backdrop);backdrop.querySelector('button')?.focus();}};
const view={extend:obj=>obj};
fetch('/files/www/luci-static/resources/view/autoverify.js').then(r=>r.text()).then(source=>{let obj=new Function('view','form','uci','fs','ui','dom','poll','rpc','L',source)(view,form,uci,fs,ui,dom,poll,rpc,L);window.previewView=obj;return obj.load().then(()=>obj.render());}).then(node=>dom.content(document.querySelector('#app'),node)).catch(err=>document.querySelector('#app').textContent=err.stack);
document.querySelector('#theme').onclick=()=>document.body.classList.toggle('dark');
</script>
</html>
